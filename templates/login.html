<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Telegram Forwarder – Login</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:2rem;background:#f5f5f5}
    .card{max-width:400px;padding:2rem;border:1px solid #ddd;border-radius:8px;background:#fff}
    input{width:100%;padding:.5rem;margin .5rem 0;}
    button{padding:.6rem 1rem;}
  </style>
</head>
<body>
<div class="card">
  <h2>Login with phone number</h2>
  <form method="post">
    <input name="phone" placeholder="+1234567890" required>
    <button type="submit">Send OTP</button>
  </form>
</div>
</body>
</html>
