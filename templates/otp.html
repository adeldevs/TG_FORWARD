<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Telegram Forwarder – OTP</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:2rem;background:#f5f5f5}
    .card{max-width:400px;padding:2rem;border:1px solid #ddd;border-radius:8px;background:#fff}
    input{width:100%;padding:.5rem;margin .5rem 0;}
    button{padding:.6rem 1rem;}
  </style>
</head>
<body>
<div class="card">
  <h2>Enter OTP sent to your phone</h2>
  <p>Phone: <code>{{ phone }}</code></p>
  <form method="post">
    <input name="code" placeholder="12345" required>
    <button type="submit">Verify</button>
  </form>
  <p><a href="/">Back</a></p>
</div>
</body>
</html>
